name: MobiVerse India CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Validation (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Integration & Unit Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: github_actions_ci_secret_access_key
          JWT_REFRESH_SECRET: github_actions_ci_secret_refresh_key
          RAZORPAY_KEY_ID: rzp_test_MockKey123
          RAZORPAY_KEY_SECRET: MockSecretKey456
        run: npm test

  frontend-test-and-build:
    name: Frontend Tests & Production Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Frontend Vitest Component Tests
        working-directory: ./client
        run: npm test

      - name: Build Production Client Bundle
        working-directory: ./client
        run: npm run build
